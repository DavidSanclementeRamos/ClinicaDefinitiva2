    code: "const token = pm.environment.get(\"token\");\r

      if (token) {\r

      \    pm.request.headers.add({\r

      \        key: \"Authorization\",\r

      \        value: `Bearer ${token}`\r

      \    });\r

      }"
    language: text/javascript
